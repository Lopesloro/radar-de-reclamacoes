services:
  - type: web
    name: radar-de-reclamacoes-pi6
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips: o serviço só recebe tráfego pelo proxy do Render.
    # O Matheus confere essa linha na Fase 0 dele (plano/02-matheus.md, item 0.2).
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Chave da sessão gerada pelo Render: nunca fica no repositório.
      - key: RADAR_CHAVE
        generateValue: true
      # Cifra o token das fontes em repouso. Sem ela o sistema RECUSA gravar
      # token, em vez de gravar em texto no banco.
      - key: RADAR_COFRE_CHAVE
        generateValue: true
      # Preenchidas no painel do Render, nunca aqui.
      # DATABASE_URL: a ligação interna do Postgres do próprio Render.
      - key: DATABASE_URL
        sync: false
      # Senha do administrador do primeiro arranque. Sem ela ninguém entra: o
      # sistema não tem senha escrita no código.
      - key: RADAR_ADMIN_SENHA
        sync: false
      # Chave da IA que separa as avaliações por assunto. Sem ela o sistema usa
      # o modelo próprio e nada quebra.
      - key: RADAR_IA_CHAVE
        sync: false
      # Credenciais do aplicativo no Google, para a fonte do Perfil da Empresa.
      - key: RADAR_GOOGLE_CLIENTE_ID
        sync: false
      - key: RADAR_GOOGLE_CLIENTE_SEGREDO
        sync: false
