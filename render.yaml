# A configuração do serviço como código. O serviço no ar foi criado à mão e
# ficou diferente deste arquivo em dois pontos que importam: o `startCommand`
# estava sem `--forwarded-allow-ips` e o `healthCheckPath` estava vazio. Adotar
# este arquivo no Render alinha os dois e passa a ligar o banco sozinho.
services:
  - type: web
    name: radar-de-reclamacoes-pi6
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips: o serviço só recebe tráfego pelo proxy do Render.
    # Sem isso o uvicorn ignora o X-Forwarded-For, e o endereço de quem pede
    # passa a ser o do proxy. O limite de tentativas de entrada lê o ÚLTIMO item
    # desse cabeçalho (app/seguranca/limite.py), que é o que o proxy escreveu e
    # o cliente não escolhe.
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Chave da sessão gerada pelo Render: nunca fica no repositório.
      - key: RADAR_CHAVE
        generateValue: true
      # Cifra o token das fontes em repouso. Sem ela o sistema RECUSA gravar
      # token, em vez de gravar em texto no banco.
      - key: RADAR_COFRE_CHAVE
        generateValue: true
      # O banco é ligado pelo próprio Render, a partir do Postgres que já existe
      # na conta. A senha nunca passa por mão nenhuma nem por arquivo nenhum.
      - key: DATABASE_URL
        fromDatabase:
          name: radar-reclamacoes-db
          property: connectionString
      # Senha do administrador do primeiro arranque. Preenchida no painel, nunca
      # aqui. Sem ela ninguém entra: o sistema não tem senha escrita no código.
      - key: RADAR_ADMIN_SENHA
        sync: false
      # Chave da IA que separa as avaliações por assunto. Sem ela o sistema usa
      # o modelo próprio e nada quebra.
      - key: RADAR_IA_CHAVE
        sync: false
      # Credenciais do aplicativo no Google, para a fonte do Perfil da Empresa.
      - key: RADAR_GOOGLE_CLIENTE_ID
        sync: false
      - key: RADAR_GOOGLE_CLIENTE_SEGREDO
        sync: false
