services:
  - type: web
    name: radar-de-reclamacoes
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Chave da sessão gerada pelo Render: não existe no repositório.
      - key: RADAR_CHAVE
        generateValue: true
      # Usuário e senha ficam no painel do Render, nunca aqui. Sem eles, o site
      # sobe com a credencial de demonstração e avisa isso na tela de entrada.
      - key: RADAR_USUARIO
        sync: false
      - key: RADAR_SENHA
        sync: false
