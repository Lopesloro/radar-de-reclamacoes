[project]
name = "radar-de-reclamacoes-pi6"
version = "0.1.0"
description = "Descobre por que os clientes de um pequeno negócio reclamam, testa a solução antes de gastar e prova se funcionou"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: testes de ponta a ponta com navegador (Playwright)"]
# Os de ponta a ponta precisam do navegador instalado: rodam com `pytest -m e2e`.
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
